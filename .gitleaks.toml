# Seit:      2026-11-28
#
# Es gelten alle Regeln von gitleaks. Eine Ausnahme gilt nur für genau eine Regel und nur für
# die hier genannten Pfade, nie pauschal. Jede neue Ausnahme braucht eine Begründung.

title = "PaiBot"

[extend]
useDefault = true

# Die Regel generic-api-key schlägt bei Zuweisungen wie `TOKEN = "…"`, `newPassword: "…"` oder
# `toolKey: "…"` an. In Testdateien sind das erfundene Werte für Fixtures, keine Zugangsdaten.
# Regeln für echte Formate (Anbieter-Schlüssel, private Schlüssel, Cloud-Zugänge) bleiben auch dort aktiv.
[[allowlists]]
description = "Erfundene Test-Werte in Testdateien, Korpus des Tors und Browser-Skript für die Seite Apps (nur Regel generic-api-key)"
targetRules = ["generic-api-key"]
paths = [
  '''\.test\.(ts|tsx|mjs)$''',
  '''^packages/gate/src/fassungen/fassung-\d+\.korpus\.json$''',
  '''^scripts/apps-browser\.mjs$''',
]
