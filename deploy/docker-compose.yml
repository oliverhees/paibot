# Paibot – alle Dienste für den Betrieb (lokal oder mit Coolify).
# Start lokal:  docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: paibot

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paibot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      POSTGRES_DB: ${POSTGRES_DB:-paibot}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      # Nur lokal erreichbar, nie ins Internet freigeben.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-paibot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-paibot}
      APP_URL: ${APP_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  postgres-data:
