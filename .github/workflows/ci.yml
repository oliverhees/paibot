# Seit:      2026-11-07

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Wegwerf-Datenbank nur für die Tests gegen echtes Postgres (gleiche Hauptversion wie in
      # deploy/docker-compose.yml). Das Passwort gilt nur für diesen Dienst-Container. Die Tests der
      # Datenbank-Rollen legen ihre eingeschränkten Rollen selbst an (über den Superuser) und
      # löschen sie danach wieder.
      postgres:
        image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
        env:
          POSTGRES_PASSWORD: ci-wegwerf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PAIBOT_TEST_DATABASE_URL: postgres://postgres:ci-wegwerf@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm headers:check
      - run: pnpm typecheck
      # Pakete nacheinander testen: Jedes Paket startet schon selbst mehrere Vitest-Worker, und
      # viele Tests legen je Fall eine PGlite-Datenbank im Speicher an. Laufen alle Pakete
      # gleichzeitig, teilen sich auf dem Runner zu viele Worker die Kerne und den Speicher, und
      # das Anlegen der Test-Datenbank überschreitet die Zeitgrenze der Hooks.
      - run: pnpm test --concurrency=1
      - run: pnpm build
      - run: pnpm licenses:check
      - name: Sicherheitsmeldungen der Abhängigkeiten (Betrieb)
        run: pnpm audit --prod --audit-level high

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Stack bauen und starten
        run: |
          sh deploy/env-erzeugen.sh deploy/.env
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
      - name: Healthcheck mit Datenbank prüfen
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -D /tmp/health.head http://localhost:3000/api/health | tee /tmp/health.json | grep -q '"db":"ok"'; then
              if grep -qi '^x-pb-db-rolle:' /tmp/health.head; then
                echo "App verbindet sich mit zu vielen Rechten"; exit 1
              fi
              echo "Healthcheck ok"; exit 0
            fi
            sleep 2
          done
          echo "Healthcheck fehlgeschlagen"; cat /tmp/health.json || true
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env logs
          exit 1
      - name: Worker prüfen (gesund, erwartete Log-Zeilen, kein Port)
        run: |
          compose="docker compose -f deploy/docker-compose.yml --env-file deploy/.env"
          status=""
          for i in $(seq 1 60); do
            id=$($compose ps -q worker)
            status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$id" 2>/dev/null || true)
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          $compose logs worker > /tmp/worker.log 2>&1
          cat /tmp/worker.log
          if [ "$status" != "healthy" ]; then echo "Worker nicht gesund: $status"; exit 1; fi
          for zeile in "Datenbank erreichbar." "Datenbank auf Stand" "Rechte der Rolle paibot_app geprüft: eingeschränkt." \
                       "Warteschlange gestartet." "Bereit: nimmt Läufe an" "Herzschlag läuft."; do
            grep -qF "[paibot-worker] $zeile" /tmp/worker.log || { echo "Log-Zeile fehlt: $zeile"; exit 1; }
          done
          if grep -qF "Start abgebrochen" /tmp/worker.log; then echo "Worker-Start abgebrochen"; exit 1; fi
          if [ -n "$(docker port "$id")" ]; then echo "Worker veröffentlicht einen Port"; exit 1; fi
          if docker exec "$id" printenv DATABASE_MIGRATION_URL >/dev/null; then
            echo "Worker kennt die Migrations-Rolle"; exit 1
          fi
          if docker exec "$id" sh -c 'touch /app/schreibtest' 2>/dev/null; then
            echo "Dateisystem des Workers ist beschreibbar"; exit 1
          fi
          echo "Worker ok"
      - name: Worker endet bei SIGTERM sauber
        run: |
          compose="docker compose -f deploy/docker-compose.yml --env-file deploy/.env"
          id=$($compose ps -q worker)
          $compose stop worker
          code=$(docker inspect --format '{{.State.ExitCode}}' "$id")
          $compose logs worker | tail -5
          [ "$code" = "0" ] || { echo "Exit-Code $code statt 0"; exit 1; }
          $compose logs worker | grep -qF "[paibot-worker] Beendet." || { echo "Log-Zeile „Beendet.“ fehlt"; exit 1; }
      - name: Aufräumen
        if: always()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env down -v
