name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm licenses:check

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Stack bauen und starten
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
      - name: Healthcheck mit Datenbank prüfen
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health | tee /tmp/health.json | grep -q '"db":"ok"'; then
              echo "Healthcheck ok"; exit 0
            fi
            sleep 2
          done
          echo "Healthcheck fehlgeschlagen"; cat /tmp/health.json || true
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env logs
          exit 1
      - name: Aufräumen
        if: always()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env down -v
