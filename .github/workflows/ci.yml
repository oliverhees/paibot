# PaiBot – CI: prüft Lint, Köpfe, Typen, Tests, Build, Lizenzen, Browser-Tests und den Docker-Stack.
#
# Autor:     Oliver Hees
# Website:   https://paibot.de
# Copyright: 2026 Oliver Hees. Alle Urheberrechte liegen beim Autor.
# Lizenz:    PaiBot Fair-Code-Lizenz 1.1 – siehe Datei LICENSE im Projektstamm
# Seit:      2026-11-07

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Wegwerf-Datenbank nur für die Tests gegen echtes Postgres (gleiche Hauptversion wie in
      # deploy/docker-compose.yml). Das Passwort gilt nur für diesen Dienst-Container. Die Tests der
      # Datenbank-Rollen legen ihre eingeschränkten Rollen selbst an (über den Superuser) und
      # löschen sie danach wieder.
      postgres:
        image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
        env:
          POSTGRES_PASSWORD: ci-wegwerf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PAIBOT_TEST_DATABASE_URL: postgres://postgres:ci-wegwerf@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm headers:check
      - run: pnpm typecheck
      # Pakete nacheinander testen: Jedes Paket startet schon selbst mehrere Vitest-Worker, und
      # viele Tests legen je Fall eine PGlite-Datenbank im Speicher an. Laufen alle Pakete
      # gleichzeitig, teilen sich auf dem Runner zu viele Worker die Kerne und den Speicher, und
      # das Anlegen der Test-Datenbank überschreitet die Zeitgrenze der Hooks.
      - run: pnpm test --concurrency=1
      # Sicherung und Wiederherstellung gegen echtes Postgres (tools/durchstich/src/sicherung.test.ts).
      # psql, pg_dump und pg_restore kommen aus demselben Image wie der Dienst-Container: Auf dem
      # Runner liegt nur eine ältere Fassung, mit der sich der Test sonst überspringen würde.
      - name: Sicherung und Wiederherstellung gegen echtes Postgres
        env:
          PAIBOT_TEST_SICHERUNG_PFLICHT: "1"
        run: |
          set -eu
          bin="$RUNNER_TEMP/pg-werkzeuge"
          mkdir -p "$bin"
          for werkzeug in psql pg_dump pg_restore; do
            cat > "$bin/$werkzeug" <<EOF
          #!/bin/sh
          exec docker run --rm -i --network host -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGOPTIONS postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32 $werkzeug "\$@"
          EOF
            chmod +x "$bin/$werkzeug"
          done
          "$bin/pg_dump" --version
          PAIBOT_TEST_PG_BIN="$bin" pnpm --filter @paibot/durchstich exec vitest run src/sicherung.test.ts
      - run: pnpm build
      - run: pnpm licenses:check
      - run: pnpm doku:check --streng
      - run: pnpm compose:vergleich
      # Die Coolify-Datei mit Beispielwerten in der Form, die Coolify erzeugt, durch Docker Compose.
      - name: Compose-Datei für Coolify gültig
        run: |
          set -eu
          beispiel="$RUNNER_TEMP/coolify-beispiel.env"
          {
            echo "SERVICE_HEX_64_PGOWNER=$(openssl rand -hex 32)"
            echo "SERVICE_HEX_64_PGAPP=$(openssl rand -hex 32)"
            echo "SERVICE_HEX_64_PGWORKER=$(openssl rand -hex 32)"
            echo "SERVICE_REALBASE64_32_PAIBOT=$(openssl rand -base64 32)"
            echo "SERVICE_URL_WEB=https://paibot.example.de"
            echo "SERVICE_URL_WEB_3000=https://paibot.example.de:3000"
          } > "$beispiel"
          docker compose -f deploy/docker-compose.coolify.yml --env-file "$beispiel" config --quiet
          docker compose -f deploy/docker-compose.coolify.yml --env-file "$beispiel" config \
            | grep -qF "APP_URL: https://paibot.example.de"
      - name: Sicherheitsmeldungen der Abhängigkeiten (Betrieb)
        run: pnpm audit --prod --audit-level high

  # Ende-zu-Ende-Prüfung im Produktions-Build (tools/e2e): Browser-Ablauf mit Netz-Sperre in
  # Web-App, Worker und Migrations-Schritt, dazu die beiden Gegenproben, die rot werden müssen.
  e2e:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    services:
      # Gleicher Dienst-Container wie im Job check. Die Prüfung legt darauf eine eigene
      # Wegwerf-Datenbank und Rolle an und löscht beides am Ende.
      postgres:
        image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
        env:
          # Mindestens 24 Zeichen: Der Migrations-Schritt startet sonst im Produktions-Modus nicht.
          POSTGRES_PASSWORD: ci-wegwerf-nur-fuer-die-e2e-pruefung
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PAIBOT_E2E_DATABASE_URL: postgres://postgres:ci-wegwerf-nur-fuer-die-e2e-pruefung@127.0.0.1:5432/postgres
      # Fehlt Playwright, bricht die Prüfung ab, statt sich als übersprungen zu melden.
      PAIBOT_E2E_PFLICHT: "1"
      # Fest gepinnt; muss zur Playwright-Fassung passen, mit der die Prüfung lokal läuft.
      PLAYWRIGHT_VERSION: 1.63.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Playwright gehört nicht zu den Abhängigkeiten des Projekts: eigener Ordner außerhalb des
      # Projekts, exakte Fassung aus tools/e2e/playwright-ci (npm ci prüft jedes Paket gegen die
      # Prüfsumme in package-lock.json), ohne Installations-Skripte; Chromium samt Systempaketen.
      # Chromium lädt Playwright selbst über HTTPS; eine eigene Prüfsumme dafür legt dieser Schritt nicht fest.
      - name: Playwright und Chromium installieren (gepinnt)
        run: |
          set -eu
          pw="$RUNNER_TEMP/playwright"
          mkdir -p "$pw"
          cp tools/e2e/playwright-ci/package.json tools/e2e/playwright-ci/package-lock.json "$pw/"
          gesperrt=$(node -e "console.log(require('$pw/package-lock.json').packages['node_modules/playwright'].version)")
          [ "$gesperrt" = "$PLAYWRIGHT_VERSION" ] || { echo "package-lock.json: Playwright $gesperrt statt $PLAYWRIGHT_VERSION"; exit 1; }
          npm ci --prefix "$pw" --no-audit --no-fund --ignore-scripts
          echo "NODE_PATH=$pw/node_modules" >> "$GITHUB_ENV"
          node "$pw/node_modules/playwright/cli.js" install --with-deps chromium
          version=$(node -e "console.log(require('$pw/node_modules/playwright/package.json').version)")
          [ "$version" = "$PLAYWRIGHT_VERSION" ] || { echo "Playwright $version statt $PLAYWRIGHT_VERSION"; exit 1; }
      - run: pnpm build
      - name: Ende-zu-Ende-Prüfung
        run: node tools/e2e/src/e2e.mjs --ausgabe "$RUNNER_TEMP/e2e"
      # Gegenproben: Ein absichtlicher Aufruf nach außen (in der Web-App bzw. im Browser) muss die
      # Prüfung rot machen, und zwar aus genau diesem Grund.
      - name: Gegenprobe – Aufruf nach außen aus der Web-App wird erkannt
        run: |
          set +e
          node tools/e2e/src/e2e.mjs --gegenprobe server --ausgabe "$RUNNER_TEMP/e2e-gegenprobe-server" > "$RUNNER_TEMP/gegenprobe-server.txt" 2>&1
          code=$?
          set -e
          tail -15 "$RUNNER_TEMP/gegenprobe-server.txt"
          [ "$code" = "1" ] || { echo "Gegenprobe server: Exit $code statt 1"; exit 1; }
          grep -qF "FEHLER kein Verkehr nach außen (Server)" "$RUNNER_TEMP/gegenprobe-server.txt" || { echo "Gegenprobe server: Verstoß nicht gemeldet"; exit 1; }
          grep -qE "Netz \(web\): tcp → example\.org:443" "$RUNNER_TEMP/gegenprobe-server.txt" || { echo "Gegenprobe server: Ziel nicht im Log"; exit 1; }
          echo "Gegenprobe server ok: rot, wie erwartet"
      - name: Gegenprobe – Aufruf nach außen im Browser wird erkannt
        run: |
          set +e
          node tools/e2e/src/e2e.mjs --gegenprobe browser --ausgabe "$RUNNER_TEMP/e2e-gegenprobe-browser" > "$RUNNER_TEMP/gegenprobe-browser.txt" 2>&1
          code=$?
          set -e
          tail -15 "$RUNNER_TEMP/gegenprobe-browser.txt"
          [ "$code" = "1" ] || { echo "Gegenprobe browser: Exit $code statt 1"; exit 1; }
          grep -qF "FEHLER kein Verkehr nach außen (Browser)" "$RUNNER_TEMP/gegenprobe-browser.txt" || { echo "Gegenprobe browser: Verstoß nicht gemeldet"; exit 1; }
          echo "Gegenprobe browser ok: rot, wie erwartet"
      # Kein Artefakt (dafür bräuchte es eine weitere Action): im Fehlerfall die wichtigsten Zeilen.
      - name: Ergebnis und Logs im Fehlerfall
        if: failure()
        run: |
          for ordner in "$RUNNER_TEMP"/e2e "$RUNNER_TEMP"/e2e-gegenprobe-*; do
            [ -d "$ordner" ] || continue
            echo "::group::$ordner – ergebnis.json"
            if [ -f "$ordner/ergebnis.json" ]; then
              node -e 'const e=require(process.argv[1]); for (const s of e.schritte) console.log((s.ok?"ok     ":"FEHLER ")+s.name+(s.fehler?"\n       "+s.fehler.split("\n").slice(0,8).join("\n       "):"")); console.log(JSON.stringify({pruefungen:e.pruefungen, netz:e.netz, fremdImBrowser:e.fremdImBrowser, konsole:e.konsole}, null, 2))' "$ordner/ergebnis.json"
            else
              echo "keine ergebnis.json"
            fi
            echo "::endgroup::"
            for log in migrate web worker worker-2 worker-3 anbieter belege-pruefen; do
              [ -f "$ordner/$log.log" ] || continue
              echo "::group::$ordner – $log.log (Ende)"
              tail -60 "$ordner/$log.log"
              echo "::endgroup::"
            done
            if [ -f "$ordner/netz.jsonl" ]; then
              echo "::group::$ordner – netz.jsonl (ohne Start-Zeilen)"
              grep -v '"art":"start"' "$ordner/netz.jsonl" | tail -40 || true
              echo "::endgroup::"
            fi
          done

  # Browser-Tests der Oberfläche (packages/ui/browser): Fokus, Tastatur und Maße in echtem Chromium.
  # Jede Testdatei startet einen eigenen Vite-Server mit eigenem Zwischenspeicher und lädt nur von
  # 127.0.0.1; Chromium löst keinen anderen Namen auf (packages/ui/browser/hilfen.mjs).
  browser:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    env:
      # Fest gepinnt, gleiche Fassung wie im Job e2e (tools/e2e/playwright-ci). Der Aufruf setzt
      # PAIBOT_BROWSER_TESTS=1: Fehlt Playwright oder Chromium, schlägt der Lauf fehl, statt zu überspringen.
      PLAYWRIGHT_VERSION: 1.63.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Wie im Job e2e: Playwright außerhalb des Projekts, exakte Fassung mit Prüfsummen aus
      # package-lock.json, ohne Installations-Skripte; Chromium samt Systempaketen.
      - name: Playwright und Chromium installieren (gepinnt)
        run: |
          set -eu
          pw="$RUNNER_TEMP/playwright"
          mkdir -p "$pw"
          cp tools/e2e/playwright-ci/package.json tools/e2e/playwright-ci/package-lock.json "$pw/"
          gesperrt=$(node -e "console.log(require('$pw/package-lock.json').packages['node_modules/playwright'].version)")
          [ "$gesperrt" = "$PLAYWRIGHT_VERSION" ] || { echo "package-lock.json: Playwright $gesperrt statt $PLAYWRIGHT_VERSION"; exit 1; }
          npm ci --prefix "$pw" --no-audit --no-fund --ignore-scripts
          echo "NODE_PATH=$pw/node_modules" >> "$GITHUB_ENV"
          node "$pw/node_modules/playwright/cli.js" install --with-deps chromium
          version=$(node -e "console.log(require('$pw/node_modules/playwright/package.json').version)")
          [ "$version" = "$PLAYWRIGHT_VERSION" ] || { echo "Playwright $version statt $PLAYWRIGHT_VERSION"; exit 1; }
      - name: Browser-Tests der Oberfläche
        run: pnpm --filter @paibot/ui test:browser

  # Seite „Apps“ im echten Browser (scripts/apps-browser.mjs): Texte einer feindlichen App nur als Text,
  # Token nach dem Absenden nirgends, Einstufen mit dem Abdruck der gezeigten Fassung, Fehlerwege mit
  # Ausweg. Der Lauf startet die Web-App im Produktions-Build mit einer Wegwerf-Datenbank auf dem
  # Dienst-Container und räumt am Ende alles ab.
  apps-browser:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    services:
      # Gleicher Dienst-Container wie im Job e2e; das Skript legt eine eigene Wegwerf-Datenbank und
      # Rolle an und löscht beides am Ende.
      postgres:
        image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
        env:
          # Mindestens 24 Zeichen: Der Migrations-Schritt startet sonst im Produktions-Modus nicht.
          POSTGRES_PASSWORD: ci-wegwerf-nur-fuer-die-e2e-pruefung
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PAIBOT_DOKU_DATABASE_URL: postgres://postgres:ci-wegwerf-nur-fuer-die-e2e-pruefung@127.0.0.1:5432/postgres
      # Fest gepinnt, gleiche Fassung wie in den Jobs e2e und browser (tools/e2e/playwright-ci).
      PLAYWRIGHT_VERSION: 1.63.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright und Chromium installieren (gepinnt)
        run: |
          set -eu
          pw="$RUNNER_TEMP/playwright"
          mkdir -p "$pw"
          cp tools/e2e/playwright-ci/package.json tools/e2e/playwright-ci/package-lock.json "$pw/"
          gesperrt=$(node -e "console.log(require('$pw/package-lock.json').packages['node_modules/playwright'].version)")
          [ "$gesperrt" = "$PLAYWRIGHT_VERSION" ] || { echo "package-lock.json: Playwright $gesperrt statt $PLAYWRIGHT_VERSION"; exit 1; }
          npm ci --prefix "$pw" --no-audit --no-fund --ignore-scripts
          echo "NODE_PATH=$pw/node_modules" >> "$GITHUB_ENV"
          node "$pw/node_modules/playwright/cli.js" install --with-deps chromium
          version=$(node -e "console.log(require('$pw/node_modules/playwright/package.json').version)")
          [ "$version" = "$PLAYWRIGHT_VERSION" ] || { echo "Playwright $version statt $PLAYWRIGHT_VERSION"; exit 1; }
      - run: pnpm build
      - name: Seite „Apps“ im Browser
        run: pnpm doku:app -- pnpm apps:browser

  # Docker-Stack ohne Weg nach draußen (deploy/docker-compose.ohne-internet.yml): Das Netz
  # paibot-aussen ist intern, der Test-Anbieter steht im selben Netz. Geprüft wird von innen über
  # HTTP (Einrichtung, Chat, Belege) und mit einer Netz-Probe aus web und worker.
  ohne-internet:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ohne-internet.yml --env-file deploy/.env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Der eigenständige Prüfer der Belege (ein Bündel ohne Abhängigkeiten) läuft im Prüf-Container.
      - name: Prüfer der Belege bauen
        run: pnpm exec turbo run build --filter=@paibot/receipts --output-logs=errors-only
      - name: Stack ohne Weg nach draußen starten
        run: |
          set -eu
          sh deploy/env-erzeugen.sh deploy/.env
          echo "FAKE_PROVIDER_API_KEY=$(od -An -tx1 -N24 /dev/urandom | tr -d ' \n')" >> deploy/.env
          $COMPOSE config --format json > "$RUNNER_TEMP/ohne-internet-config.json"
          python3 - "$RUNNER_TEMP/ohne-internet-config.json" <<'PY'
          import json, sys
          c = json.load(open(sys.argv[1]))
          fehler = [n for n, v in c["networks"].items() if not v.get("internal")]
          fehler += ["Port an " + n for n, s in c["services"].items() if s.get("ports")]
          sys.exit("Nicht abgeschottet: %s" % fehler if fehler else 0)
          PY
          $COMPOSE up -d --build
          for dienst in web worker fake-provider; do
            status=""
            for i in $(seq 1 60); do
              status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$($COMPOSE ps -q "$dienst")" 2>/dev/null || true)
              [ "$status" = "healthy" ] && break
              sleep 3
            done
            if [ "$status" != "healthy" ]; then $COMPOSE logs "$dienst" | tail -80; echo "$dienst nicht gesund: $status"; exit 1; fi
          done
          for netz in paibot-intern paibot-aussen paibot-schleuse; do
            [ "$(docker network inspect "paibot_$netz" --format '{{.Internal}}')" = "true" ] || { echo "Netz $netz ist nicht intern"; exit 1; }
          done
          echo "Stack läuft, alle Netze intern"
      - name: Einrichtung, Chat und Belege über HTTP (von innen)
        run: |
          set -eu
          code=$($COMPOSE logs web | grep -oE 'Einrichtungs-Code: [0-9A-Z]{4}-[0-9A-Z]{4}-[0-9A-Z]{4}' | tail -1 | cut -d' ' -f2)
          [ -n "$code" ] || { echo "Kein Einrichtungs-Code im Log von web"; $COMPOSE logs web | tail -40; exit 1; }
          ausgabe="$RUNNER_TEMP/ohne-internet"
          mkdir -p "$ausgabe" && chmod 0777 "$ausgabe"
          # --no-deps: Der Lauf darf web und migrate nicht neu anlegen; ein neuer Migrations-Schritt
          # verwirft den Einrichtungs-Code, und web erzeugt beim Neustart einen anderen.
          PAIBOT_PRUEF_CODE="$code" PAIBOT_PRUEF_AUSGABE_HOST="$ausgabe" $COMPOSE --profile pruefen run --rm --no-deps pruefer
      - name: Kein Ziel außerhalb aus web und worker erreichbar
        run: |
          set -eu
          # Ein Dienst auf dem Runner selbst (außerhalb der Docker-Netze) als Ziel, das sicher läuft.
          host_ip=$(hostname -I | awk '{print $1}')
          python3 -m http.server 18099 --bind 0.0.0.0 > /dev/null 2>&1 &
          echo $! > "$RUNNER_TEMP/http-server.pid"
          sleep 1
          draussen="$host_ip:18099 1.1.1.1:443 8.8.8.8:53 9.9.9.9:443 example.org:443 github.com:443"
          # Gegenprobe: Aus einem gewöhnlichen Container erreicht die Probe den Dienst auf dem Runner.
          docker run --rm -i --network bridge --cap-drop ALL \
            node:26-alpine@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5 \
            node - --drinnen "$host_ip:18099" < tools/e2e/src/netz-probe.cjs
          # Nur zur Auskunft: die Adresse des Docker-Netzes auf dem Runner selbst (falls es eine gibt).
          gateway=$(docker network inspect paibot_paibot-aussen --format '{{range .IPAM.Config}}{{.Gateway}}{{end}}')
          info=""; [ -n "$gateway" ] && info="--info $gateway:18099"
          echo "--- web"
          $COMPOSE exec -T web node - --draussen $draussen --drinnen fake-provider:8080 postgres:5432 $info < tools/e2e/src/netz-probe.cjs
          echo "--- worker"
          $COMPOSE exec -T worker node - --draussen $draussen --drinnen fake-provider:8080 postgres:5432 $info < tools/e2e/src/netz-probe.cjs
          kill "$(cat "$RUNNER_TEMP/http-server.pid")" || true
      - name: Ergebnis und Logs im Fehlerfall
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/ohne-internet/ergebnis.json" ] && cat "$RUNNER_TEMP/ohne-internet/ergebnis.json"
          [ -f "$RUNNER_TEMP/ohne-internet/belege-pruefen.log" ] && cat "$RUNNER_TEMP/ohne-internet/belege-pruefen.log"
          $COMPOSE ps -a || true
          $COMPOSE logs --no-color --tail 150 || true
      - name: Aufräumen
        if: always()
        run: $COMPOSE --profile pruefen down -v || true

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Der Doku-Index wird weiter unten mit Node gebaut; dafür braucht das Skript seine Pakete.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stack bauen und starten
        run: |
          sh deploy/env-erzeugen.sh deploy/.env
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
      - name: Healthcheck mit Datenbank prüfen
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -D /tmp/health.head http://localhost:3000/api/health | tee /tmp/health.json | grep -q '"db":"ok"'; then
              if grep -qi '^x-pb-db-rolle:' /tmp/health.head; then
                echo "App verbindet sich mit zu vielen Rechten"; exit 1
              fi
              echo "Healthcheck ok"; exit 0
            fi
            sleep 2
          done
          echo "Healthcheck fehlgeschlagen"; cat /tmp/health.json || true
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env logs
          exit 1
      - name: Migrations-Dienst und Zugangsdaten prüfen
        run: |
          set -eu
          compose="docker compose -f deploy/docker-compose.yml --env-file deploy/.env"
          mig=$($compose ps -a -q migrate)
          code=$(docker inspect --format '{{.State.ExitCode}} {{.State.Status}}' "$mig")
          $compose logs migrate | tail -20
          [ "$code" = "0 exited" ] || { echo "migrate: $code statt 0 exited"; exit 1; }
          $compose logs migrate | grep -qF "Migrations-Schritt fertig." || { echo "Log-Zeile fehlt"; exit 1; }
          if [ -n "$(docker port "$mig")" ]; then echo "migrate veröffentlicht einen Port"; exit 1; fi
          superuser_pw=$(grep '^POSTGRES_PASSWORD=' deploy/.env | cut -d= -f2-)
          for dienst in web worker; do
            id=$($compose ps -q "$dienst")
            # Weder in der Konfiguration des Containers noch in der Umgebung des laufenden Prozesses.
            if docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$id" | grep -q '^DATABASE_MIGRATION_URL='; then
              echo "$dienst: DATABASE_MIGRATION_URL in der Konfiguration"; exit 1
            fi
            umgebung=$(docker exec "$id" sh -c 'tr "\0" "\n" < /proc/1/environ')
            if printf '%s\n' "$umgebung" | grep -q '^DATABASE_MIGRATION_URL='; then
              echo "$dienst: DATABASE_MIGRATION_URL im laufenden Prozess"; exit 1
            fi
            if printf '%s\n' "$umgebung" | grep -qF "$superuser_pw"; then
              echo "$dienst: Passwort des Tabellen-Besitzers im laufenden Prozess"; exit 1
            fi
            # Test-Hilfen (PGlite, Test-Datenbank, Test-Anbieter) sind nicht im Produktions-Bündel.
            # Gesucht wird nach Code der Pakete, nicht nach Namen in Pfaden anderer Pakete.
            if docker exec "$id" sh -c 'grep -rlsF -e "@electric-sql/pglite/dist" -e "createTestDb" -e "createFakeProvider" /app/apps/web/.next/server /app/apps/worker/dist/worker.mjs; find /app -path "*/node_modules/@electric-sql/pglite" -print -quit' | grep -q .; then
              echo "$dienst: Test-Hilfen im Bündel"; exit 1
            fi
          done
          echo "Zugangsdaten ok"
      # Der Doku-Index im Image ist derselbe wie der, den dieselben Quellen hier ergeben (nur Node,
      # kein Docker): gleiche Bytes im Web- und im Worker-Container.
      - name: Doku-Index im Image prüfen
        run: |
          set -eu
          compose="docker compose -f deploy/docker-compose.yml --env-file deploy/.env"
          node scripts/doku-index.mjs
          for dienst in web worker; do
            id=$($compose ps -q "$dienst")
            pfad=$(docker exec "$id" printenv PAIBOT_DOKU_INDEX)
            [ "$pfad" = "/app/doku-index/doku-index.json" ] || { echo "$dienst: PAIBOT_DOKU_INDEX ist $pfad"; exit 1; }
            docker exec "$id" cat "$pfad" | cmp - doku-index/doku-index.json || { echo "$dienst: Index im Image weicht ab oder fehlt"; exit 1; }
            abschnitte=$(docker exec "$id" grep -c '"id":' "$pfad")
            [ "$abschnitte" -ge 1 ] || { echo "$dienst: Index ohne Abschnitt"; exit 1; }
            echo "$dienst: Doku-Index ok ($abschnitte Abschnitte)"
          done
          # Die Pakete wurden nur für den Index-Bau gebraucht. Spätere Schritte installieren in einem
          # Container mit anderer Laufzeit selbst; dafür ist der Ordner wieder leer wie nach dem Checkout.
          find . -name node_modules -type d -prune -exec rm -rf {} +
      - name: Zweiter Start macht nichts kaputt
        run: |
          set -eu
          compose="docker compose -f deploy/docker-compose.yml --env-file deploy/.env"
          regeln() { $compose exec -T postgres psql -U paibot -d paibot -tAc 'select count(*) from public.rules'; }
          vorher=$(regeln)
          $compose up -d
          mig=$($compose ps -a -q migrate)
          for i in $(seq 1 30); do
            [ "$(docker inspect --format '{{.State.Status}}' "$mig")" = "exited" ] && break
            sleep 2
          done
          [ "$(docker inspect --format '{{.State.ExitCode}}' "$mig")" = "0" ] || { $compose logs migrate; exit 1; }
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/health | grep -q '"db":"ok"' && break
            sleep 2
          done
          curl -fsS -D /tmp/health2.head http://localhost:3000/api/health | grep -q '"db":"ok"'
          if grep -qi '^x-pb-db-rolle:' /tmp/health2.head; then echo "zu viele Rechte nach dem zweiten Start"; exit 1; fi
          [ "$(regeln)" = "$vorher" ] || { echo "Regeln verändert"; exit 1; }
          echo "Zweiter Start ok"
      - name: Worker prüfen (gesund, erwartete Log-Zeilen, kein Port)
        run: |
          compose="docker compose -f deploy/docker-compose.yml --env-file deploy/.env"
          status=""
          for i in $(seq 1 60); do
            id=$($compose ps -q worker)
            status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$id" 2>/dev/null || true)
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          $compose logs worker > /tmp/worker.log 2>&1
          cat /tmp/worker.log
          if [ "$status" != "healthy" ]; then echo "Worker nicht gesund: $status"; exit 1; fi
          for zeile in "Datenbank erreichbar." "Datenbank auf Stand" "Rechte der Rolle paibot_worker geprüft: eingeschränkt." \
                       "Warteschlange gestartet." "Bereit: nimmt Läufe an" "Herzschlag läuft."; do
            grep -qF "[paibot-worker] $zeile" /tmp/worker.log || { echo "Log-Zeile fehlt: $zeile"; exit 1; }
          done
          if grep -qF "Start abgebrochen" /tmp/worker.log; then echo "Worker-Start abgebrochen"; exit 1; fi
          if [ -n "$(docker port "$id")" ]; then echo "Worker veröffentlicht einen Port"; exit 1; fi
          if docker exec "$id" printenv DATABASE_MIGRATION_URL >/dev/null; then
            echo "Worker kennt die Migrations-Rolle"; exit 1
          fi
          if docker exec "$id" printenv DATABASE_URL >/dev/null; then
            echo "Worker kennt die App-Rolle"; exit 1
          fi
          if docker exec "$id" sh -c 'touch /app/schreibtest' 2>/dev/null; then
            echo "Dateisystem des Workers ist beschreibbar"; exit 1
          fi
          echo "Worker ok"
      - name: Worker endet bei SIGTERM sauber
        run: |
          compose="docker compose -f deploy/docker-compose.yml --env-file deploy/.env"
          id=$($compose ps -q worker)
          $compose stop worker
          code=$(docker inspect --format '{{.State.ExitCode}}' "$id")
          $compose logs worker | tail -5
          [ "$code" = "0" ] || { echo "Exit-Code $code statt 0"; exit 1; }
          $compose logs worker | grep -qF "[paibot-worker] Beendet." || { echo "Log-Zeile „Beendet.“ fehlt"; exit 1; }
      # Sicherung und Wiederherstellung im echten Stack, nur mit Docker (deploy/sicherung.sh):
      # mit dem Test-Anbieter einrichten und eine Unterhaltung schreiben, sichern, Stack samt Volume
      # löschen, in den normalen Stack zurückspielen (mit Prüfung der Belege-Kette), anmelden und
      # die Unterhaltung wiederfinden. Dazu zwei Gegenproben, die scheitern müssen.
      - name: Sicherung und Wiederherstellung im echten Stack
        run: |
          set -euo pipefail
          FAKE_PROVIDER_API_KEY=$(od -An -tx1 -N24 /dev/urandom | tr -d ' \n')
          export FAKE_PROVIDER_API_KEY
          compose="docker compose -f deploy/docker-compose.yml --env-file deploy/.env"
          mit_anbieter="docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ohne-internet.yml --env-file deploy/.env"
          node_image=node:26-alpine@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5
          passwort="Probe-$(od -An -tx1 -N12 /dev/urandom | tr -d ' \n')-Satz"
          ziel="$RUNNER_TEMP/sicherungen"
          echo "::group::Ausgangslage: frischer Stack mit Test-Anbieter, eingerichtet, eine Unterhaltung"
          $compose down -v
          $mit_anbieter up -d --build
          status=""
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$($mit_anbieter ps -q web)" 2>/dev/null || true)
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          [ "$status" = "healthy" ] || { $mit_anbieter logs web | tail -60; echo "web nicht gesund: $status"; exit 1; }
          code=$($mit_anbieter logs web | grep -oE 'Einrichtungs-Code: [0-9A-Z]{4}-[0-9A-Z]{4}-[0-9A-Z]{4}' | tail -1 | cut -d' ' -f2)
          [ -n "$code" ] || { echo "Kein Einrichtungs-Code im Log von web"; exit 1; }
          docker run --rm --network paibot_paibot-aussen --read-only --cap-drop ALL -v "$PWD/scripts:/probe:ro" \
            -e PAIBOT_PROBE_URL=http://web:3000 -e PAIBOT_PROBE_HERKUNFT=http://localhost:3000 \
            -e PAIBOT_PROBE_CODE="$code" -e PAIBOT_PROBE_ANBIETER_SCHLUESSEL="$FAKE_PROVIDER_API_KEY" \
            -e PAIBOT_PROBE_PASSWORT="$passwort" "$node_image" node /probe/sicherung-probe.mjs einrichten
          echo "::endgroup::"

          echo "::group::Sichern"
          sh deploy/sicherung.sh sichern --compose-datei deploy/docker-compose.yml \
            --compose-datei deploy/docker-compose.ohne-internet.yml --ziel "$ziel" | tee "$RUNNER_TEMP/sichern.txt"
          ordner=$(ls -d "$ziel"/paibot-sicherung-* | head -n 1)
          [ "$(stat -c '%a' "$ordner")" = 700 ] || { echo "Ordner der Sicherung nicht nur für den Besitzer"; exit 1; }
          for datei in datenbank.dump begleit.json; do
            [ "$(stat -c '%a' "$ordner/$datei")" = 600 ] || { echo "$datei nicht nur für den Besitzer lesbar"; exit 1; }
          done
          cat "$ordner/begleit.json"; echo
          if grep -qF '"paibot":"unbekannt"' "$ordner/begleit.json"; then echo "Stand von PaiBot fehlt in der Begleit-Datei"; exit 1; fi
          grep -qE '"belege" : \{"anzahl" : [1-9]' "$ordner/begleit.json" || { echo "keine Belege in der Sicherung"; exit 1; }
          geheimnis=$(grep '^PAIBOT_SECRET=' deploy/.env | cut -d= -f2-)
          if grep -qaF "$geheimnis" "$ordner/begleit.json" "$ordner/datenbank.dump"; then echo "PAIBOT_SECRET steht in der Sicherung"; exit 1; fi
          if grep -qaF "$FAKE_PROVIDER_API_KEY" "$ordner/datenbank.dump"; then echo "Anbieter-Schlüssel im Klartext in der Sicherung"; exit 1; fi
          echo "::endgroup::"

          echo "::group::Stack samt Volume löschen, zurückspielen in den normalen Stack"
          $mit_anbieter --profile pruefen down -v
          # Ohne -q: grep liest die Ausgabe ganz. Mit -q endet es beim ersten Treffer; unter pipefail
          # gilt die Zeile dann je nach Timing als fehlgeschlagen, obwohl der Treffer da ist.
          if docker volume ls -q | grep -x 'paibot_postgres-data' > /dev/null; then echo "Volume der Datenbank noch da"; exit 1; fi
          sh deploy/sicherung.sh zurueckspielen "$ordner" | tee "$RUNNER_TEMP/zurueckspielen.txt"
          for zeile in "✓ Ziel-Datenbank ist leer." "✓ Tabellen:" "✓ Migrations-Schritt fertig" "Kette gültig, alle Schlüssel aus der Kette." \
                       "✓ Belege-Kette geprüft, gegen den Anker aus der Begleit-Datei." "Ergebnis: Alles aus der Sicherung ist da."; do
            grep -qF "$zeile" "$RUNNER_TEMP/zurueckspielen.txt" || { echo "Zeile fehlt: $zeile"; exit 1; }
          done
          echo "::endgroup::"

          echo "::group::Anmelden, Unterhaltung wiederfinden, Rechte und Worker"
          docker run --rm --network host --read-only --cap-drop ALL -v "$PWD/scripts:/probe:ro" \
            -e PAIBOT_PROBE_URL=http://127.0.0.1:3000 -e PAIBOT_PROBE_HERKUNFT=http://localhost:3000 \
            -e PAIBOT_PROBE_PASSWORT="$passwort" "$node_image" node /probe/sicherung-probe.mjs anmelden
          curl -fsS -D "$RUNNER_TEMP/health3.head" http://localhost:3000/api/health | grep '"db":"ok"' > /dev/null
          if grep -qi '^x-pb-db-rolle:' "$RUNNER_TEMP/health3.head"; then echo "zu viele Rechte nach dem Zurückspielen"; exit 1; fi
          $compose logs worker | grep -F "[paibot-worker] Veraltete Läufe aufgeräumt:" > /dev/null || { $compose logs worker | tail -40; exit 1; }
          sh deploy/sicherung.sh pruefen "$ordner" | tail -n 3
          echo "::endgroup::"

          echo "::group::Gegenproben"
          set +e
          sh deploy/sicherung.sh zurueckspielen "$ordner" > "$RUNNER_TEMP/gegenprobe-benutzt.txt" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/gegenprobe-benutzt.txt"
          [ "$code" = 3 ] || { echo "Zurückspielen in eine benutzte Installation: Exit $code statt 3"; exit 1; }
          grep -qF "nur in eine frische Installation" "$RUNNER_TEMP/gegenprobe-benutzt.txt" || { echo "Ausweg nicht genannt"; exit 1; }
          cp -a "$ordner" "$RUNNER_TEMP/veraendert"
          printf 'x' >> "$RUNNER_TEMP/veraendert/datenbank.dump"
          set +e
          sh deploy/sicherung.sh pruefen "$RUNNER_TEMP/veraendert" > "$RUNNER_TEMP/gegenprobe-veraendert.txt" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/gegenprobe-veraendert.txt"
          [ "$code" = 1 ] || { echo "veränderte Sicherung: Exit $code statt 1"; exit 1; }
          grep -qF "Prüfsumme der Datei datenbank.dump stimmt nicht" "$RUNNER_TEMP/gegenprobe-veraendert.txt" || { echo "veränderte Sicherung nicht erkannt"; exit 1; }
          echo "::endgroup::"
          echo "Sicherung und Wiederherstellung ok"
      # Datenschleuse (Profil schleuse): Bau aus festem Commit, Netze, Vertragstest mit dem
      # Test-Anbieter. Läuft für sich und räumt sich selbst auf.
      - name: Datenschleuse prüfen (Profil schleuse, Vertragstest)
        run: |
          set -eu
          node scripts/schleuse-config.mjs --zeigen > /dev/null
          compose="docker compose -f deploy/docker-compose.yml --env-file deploy/.env --profile schleuse"
          testcompose="docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.schleuse-test.yml --env-file deploy/.env --profile schleuse"
          # Ohne Test-Zusatz veröffentlicht die Datenschleuse keinen Port.
          $compose config --format json > /tmp/schleuse-config.json
          python3 -c 'import json,sys; s=json.load(open("/tmp/schleuse-config.json"))["services"]; bad=[n for n in ("datenschleuse","schleuse-analyzer") if s[n].get("ports")]; sys.exit("Port veröffentlicht: %s" % bad if bad else 0)'
          anbieter_key=$(od -An -tx1 -N24 /dev/urandom | tr -d ' \n')
          steuer_key=$(od -An -tx1 -N24 /dev/urandom | tr -d ' \n')
          sed -i 's/^SCHLEUSE_ANBIETER_SCHLUESSEL=.*$//' deploy/.env
          { echo "SCHLEUSE_URL=http://datenschleuse:4000/v1"; echo "FAKE_PROVIDER_CONTROL_KEY=$steuer_key"; } >> deploy/.env
          SCHLEUSE_ANBIETER=eurouter=http://fake-provider:8080/v1 SCHLEUSE_ERLAUBE_HTTP=1 \
            node scripts/schleuse-config.mjs --env-datei deploy/.env
          $testcompose up -d --build
          for dienst in schleuse-analyzer datenschleuse datenschleuse-ohne-analyzer worker; do
            status=""
            for i in $(seq 1 80); do
              status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$($testcompose ps -q "$dienst")" 2>/dev/null || true)
              [ "$status" = "healthy" ] && break
              sleep 3
            done
            if [ "$status" != "healthy" ]; then $testcompose logs "$dienst"; echo "$dienst nicht gesund: $status"; exit 1; fi
          done
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}}'
          # Netze: Der Worker erreicht die Datenschleuse, aber nicht die Erkennung; web erreicht keine von beiden.
          worker=$($testcompose ps -q worker); web=$($testcompose ps -q web)
          docker exec "$worker" wget -qO- -T 5 http://datenschleuse:4000/health/liveliness > /dev/null
          if docker exec "$worker" wget -qO- -T 5 http://schleuse-analyzer:3000/health 2>/dev/null; then echo "Worker erreicht die Erkennung"; exit 1; fi
          if docker exec "$web" wget -qO- -T 5 http://datenschleuse:4000/health/liveliness 2>/dev/null; then echo "web erreicht die Datenschleuse"; exit 1; fi
          id=$($testcompose ps -q datenschleuse)
          if docker exec "$id" sh -c 'touch /app/schreibtest' 2>/dev/null; then echo "Dateisystem der Datenschleuse ist beschreibbar"; exit 1; fi
          for c in "$id" "$($testcompose ps -q schleuse-analyzer)"; do
            user=$(docker inspect --format '{{.Config.User}}' "$c")
            case "$user" in ""|0|0:*|root|root:*) echo "Container läuft als root: $c"; exit 1 ;; esac
          done
          docker run --rm --network host -v "$PWD":/repo -w /repo \
            -e PAIBOT_TEST_SCHLEUSE_URL=http://127.0.0.1:4000/v1 \
            -e PAIBOT_TEST_SCHLEUSE_KEY="$(grep '^SCHLEUSE_KEY=' deploy/.env | cut -d= -f2-)" \
            -e PAIBOT_TEST_SCHLEUSE_OHNE_ANALYZER_URL=http://127.0.0.1:4001/v1 \
            -e PAIBOT_TEST_FAKE_PROVIDER_URL=http://127.0.0.1:4600 \
            -e PAIBOT_TEST_FAKE_PROVIDER_CONTROL_KEY="$steuer_key" \
            -e PAIBOT_TEST_FAKE_PROVIDER_KEY="$anbieter_key" \
            node:26-alpine@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5 \
            sh -c 'mkdir /tmp/corepack-gesperrt && cp deploy/corepack/package.json deploy/corepack/package-lock.json /tmp/corepack-gesperrt/ && { npm ci --prefix /tmp/corepack-gesperrt --no-audit --no-fund --ignore-scripts > /tmp/npm-corepack.log 2>&1 || { cat /tmp/npm-corepack.log; exit 1; }; } && export PATH=/tmp/corepack-gesperrt/node_modules/.bin:$PATH && corepack enable && { pnpm install --frozen-lockfile --filter "@paibot/durchstich..." > /tmp/pnpm-install.log 2>&1 || { cat /tmp/pnpm-install.log; exit 1; }; } && pnpm --filter @paibot/durchstich exec vitest run src/schleuse-vertrag.test.ts'
          $testcompose down -v
      - name: Protokolle der Dienste im Fehlerfall
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env --profile schleuse logs --no-color --tail 150 || true
      - name: Aufräumen
        if: always()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env down -v
